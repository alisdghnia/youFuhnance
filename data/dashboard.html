function mdLite(md) {
  let out = '', inList = false;
  const inline = t => esc(t).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>').replace(/`(.+?)`/g, '<code>$1</code>').replace(/(https?:\/\/[^\s<]+)/g, '<a href="$1" target="_blank" rel="noopener">link</a>');
  for (const raw of md.split('\n')) {
    const l = raw.trimEnd();
    const li = /^\s*- /.test(l);
    if (!li && inList) { out += '</ul>'; inList = false; }
    if (l.startsWith('## ')) out += `<h2 class="mdh">${inline(l.slice(3))}</h2>`;
    else if (li) { if (!inList) { out += '<ul>'; inList = true; } out += `<li>${inline(l.replace(/^\s*- /, ''))}</li>`; }
    else if (/^\s*> /.test(l)) out += `<blockquote>${inline(l.replace(/^\s*> /, ''))}</blockquote>`;
    else if (l) out += `<div>${inline(l)}</div>`;
  }
  return out + (inList ? '</ul>' : '');
}

function heads() {

  const pad = Math.max(1, (hi - lo) * .08); lo -= pad; hi += pad;
  const Y1 = v => y1 + (hi - v) / (hi - lo) * h1;
  o += `<text class="tt" x="${L}" y="${y1 - 8}">Cumulative abnormal return vs SPY since Aug 25 (%)</text>`;
  const step = (hi - lo) > 12 ? 5 : (hi - lo) > 5 ? 2 : 1;
  for (let v = Math.ceil(lo / step) * step; v <= hi; v += step) o += `<line x1="${L}" x2="${W - R}" y1="${Y1(v)}" y2="${Y1(v)}" stroke="${v === 0 ? 'var(--mut)' : 'var(--line)'}" stroke-width="${v === 0 ? 1 : .6}"/><text x="${L - 6}" y="${Y1(v) + 3}" text-anchor="end">${v}</text>`;
  const line = (tk, col, w, dash) => { const pts = vis.filter(i => ms.car[tk][i] != null).map(i => `${X(ms.dates[i]).toFixed(1)},${Y1(ms.car[tk][i]).toFixed(1)}`); return pts.length ? `<polyline fill="none" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''} points="${pts.join(' ')}"/>` : ''; };
  ctx.forEach(x => { o += line(x.t, 'var(--mut)', 1.2, '4 3'); });
  const ends = [];
  direct.forEach((x, k) => { o += line(x.t, SER[k % SER.length], 2); const i = vis[vis.length - 1]; if (i != null && ms.car[x.t][i] != null) ends.push([Y1(ms.car[x.t][i]), x.t, SER[k % SER.length], X(ms.dates[i])]); });
  ends.sort((a, b) => a[0] - b[0]); let yp = -1e9;
  ends.forEach(([y, tk, col, xe]) => { const yl = Math.max(y, yp + 11); yp = yl; o += `<circle cx="${xe}" cy="${y}" r="3" fill="${col}"/><text x="${xe + 6}" y="${yl + 3}" style="fill:${col};font-weight:700">${esc(tk)}</text>`; });
  o += `<text x="${W - R}" y="${y1 - 8}" text-anchor="end">dashed grey: ${ctx.map(x => esc(x.t)).join(', ')}</text>`;
  // 2) window heatmap
  o += `<text class="tt" x="${L}" y="${y2 - 8}">Action window per proxy, as computed with closes before each day (green open, amber closing, red closed)</text>`;
  const rows = direct.map(x => [x.t, ms.lab[x.t]]).concat([['OVERALL', ms.win]]);
  rows.forEach(([nm, arr], r) => {
    o += `<text x="${L - 6}" y="${y2 + r * h2row + 11}" text-anchor="end" ${nm === 'OVERALL' ? 'class="tt"' : ''}>${esc(nm)}</text>`;
    vis.forEach(i => {
      const x0 = X(ms.dates[i]), nx = ms.dates[i + 1], x1 = Math.min(nx ? X(nx) : xT, xT);
      const lab = arr[i]; if (!lab || lab === 'n/a' || x1 <= x0) return;
      o += `<rect x="${x0}" y="${y2 + r * h2row + 1}" width="${x1 - x0}" height="${h2row - 2}" fill="${WCOL[lab] || 'var(--line)'}"/>`;
    });
  });
  // 3) probabilities
  o += `<text class="tt" x="${L}" y="${y3 - 24}">Regime probabilities (each day: fit on closes up to that day)</text>`;
  const Y3 = v => y3 + (1 - v) * h3;
  [0, .5, 1].forEach(v => { o += `<line x1="${L}" x2="${W - R}" y1="${Y3(v)}" y2="${Y3(v)}" stroke="var(--line)" stroke-width="${v === .5 ? 1 : .6}" ${v === .5 ? 'stroke-dasharray="4 3"' : ''}/><text x="${L - 6}" y="${Y3(v) + 3}" text-anchor="end">${v}</text>`; });
  const pl = (arr, col, w, dash, fill) => { const pts = vis.filter(i => arr[i] != null).map(i => [X(ms.dates[i]), Y3(arr[i])]); if (!pts.length) return ''; const pt = pts.map(q => q[0].toFixed(1) + ',' + q[1].toFixed(1)).join(' ');
    return (fill ? `<polygon points="${pts[0][0]},${Y3(0)} ${pt} ${pts[pts.length - 1][0]},${Y3(0)}" fill="${col}" opacity=".13"/>` : '') + `<polyline fill="none" stroke="${col}" stroke-width="${w}" ${dash ? `stroke-dasharray="${dash}"` : ''} points="${pt}"/>`; };
  o += pl(ms.ps, SER[0], 2, '', true) + pl(ms.bocpd, SER[1], 2) + pl(ms.bmax, SER[3], 1.3, '2 2');
  o += `<g font-size="10"><rect x="${L}" y="${y3 + h3 + 4}" width="0" height="0"/></g>`;
  o += `<text x="${L + 4}" y="${y3 - 8}" style="fill:${SER[0]};font-weight:600">basket P(stress), Markov filtered</text><text x="${L + 220}" y="${y3 - 8}" style="fill:${SER[1]};font-weight:600">basket BOCPD</text><text x="${L + 310}" y="${y3 - 8}" style="fill:${SER[3]};font-weight:600">max BOCPD, direct proxies</text>`;
  // future region
  o += `<rect x="${xT}" y="${y1 - 14}" width="${W - R - xT}" height="${y3 + h3 - y1 + 14}" fill="var(--bg)" opacity=".75"/><text x="${Math.min(xT + 8, W - R - 120)}" y="${y1 + 14}" style="font-style:italic">future: not yet known</text>`;
  // vertical markers + non-overlapping labels
  const lanes = [-1e9, -1e9, -1e9];
  const all = marks.map(x => ({n: x[0], d: x[1], col: x[2], da: x[3]})).concat([{n: 'today', d, col: 'var(--ink)', da: '', today: true}]).sort((a, b) => X(a.d) - X(b.d));
  all.forEach(mk => {
    const x = X(mk.d), w = (mk.n.length + 7) * 5.6; let ln = lanes.findIndex(e => e + 6 < x);
    if (ln < 0) ln = lanes.indexOf(Math.min(...lanes)); lanes[ln] = x + w;
    o += `<line x1="${x}" x2="${x}" y1="${yLab + ln * 12 + 8}" y2="${y3 + h3}" stroke="${mk.col}" stroke-width="${mk.today ? 2 : 1.4}" ${mk.da ? `stroke-dasharray="${mk.da}"` : ''}/><text x="${x + 3}" y="${yLab + ln * 12 + 8}" style="fill:${mk.col};font-weight:700">${esc(mk.n)} ${mk.today ? '' : fmtD(mk.d)}</text>`;
  });
  // news pins
  o += `<text x="${L - 6}" y="${yPin + 12}" text-anchor="end">news</text><line x1="${L}" x2="${W - R}" y1="${yPin + pPin + 4}" y2="${yPin + pPin + 4}" stroke="var(--line)"/>`;
  const slot = {};
  c.pins.forEach((p, k) => {
    if (p.d > d) return;
    const n = slot[p.d] = (slot[p.d] || 0) + 1, x = X(p.d) + (n > 2 ? (n - 2) * 9 : 0), y = yPin + 8 + ((n - 1) % 2) * 15;
    const col = p.level === 'ALERT' ? 'var(--bad)' : p.level === 'watch' ? 'var(--warn)' : 'var(--mut)', r = p.level === 'ALERT' ? 7 : p.level === 'watch' ? 6 : 4;
    o += `<g data-pin="${k}" style="cursor:pointer"><circle cx="${x}" cy="${y}" r="${r + 3}" fill="transparent"/><circle cx="${x}" cy="${y}" r="${r}" fill="${col}" stroke="var(--card)" stroke-width="1.5"/>${p.kind === 'escalated' ? `<circle cx="${x}" cy="${y}" r="${r + 2.5}" fill="none" stroke="${col}" stroke-width="1"/>` : ''}</g>`;
  });
  svg.innerHTML = o;
  // as-of readout
  const i = vis[vis.length - 1];
  $('asof').innerHTML = i == null ? '<span class="empty">No market close before this day yet.</span>' :
    `<span>Latest close used: <b>${fmtD(ms.dates[i])}</b></span>${winBadge(ms.win[i])}<span class="cav">basket P(stress) ${ms.ps[i] == null ? 'n/a' : ms.ps[i].toFixed(2)} · BOCPD ${ms.bocpd[i] == null ? 'n/a' : ms.bocpd[i].toFixed(2)}</span>` +
    direct.map(x => `<span class="badge ${ms.lab[x.t][i] === 'closed' ? 'b-bad' : ms.lab[x.t][i] === 'closing' ? 'b-warn' : 'b-ok'}">${esc(x.t)} ${esc(ms.lab[x.t][i] || 'n/a')}</span>`).join('');
}
function pinTip(e) {
  const g = e.target.closest && e.target.closest('[data-pin]'), tip = $('ptip');
  if (!g) { tip.style.display = 'none'; return; }
  const p = D.cps[cp].pins[+g.dataset.pin];
  tip.innerHTML = `<b>${esc(p.headline)}</b><div style="margin-top:3px">${lvlBadge(p.level)} ${verdictBadge(p.verdict)} <span class="cav">${esc(p.kind === 'seen' ? 'first seen' : p.kind)} ${fmtD(p.d)}</span></div>
    ${p.src ? `<div class="cav" style="margin-top:3px"><span class="chip t${p.tier}">T${p.tier} ${esc(p.tier_name)}</span> ${esc(p.src)}</div>` : ''}${p.quote ? `<div class="q">“${esc(p.quote)}”</div>` : ''}`;
  const r = $('cwrap').getBoundingClientRect(); tip.style.display = 'block';
  tip.style.left = Math.max(0, Math.min(e.clientX - r.left + 14, r.width - tip.offsetWidth)) + 'px'; tip.style.top = (e.clientY - r.top + 14) + 'px';
}
function execSummary(day, d) {
  const S = day.summary, L = [['News', S.news], ['Verifier', S.verifier], ['Market', S.market], ['Covenant', S.covenant], ['Team', S.team]];
  $('exec').innerHTML = `<h2 class="sec">Executive summary — ${esc(fmtD(d))}</h2><div style="font-weight:700;font-size:16px;margin:4px 0 8px">${esc(S.headline)}</div>` +
    L.map(x => `<div style="font-size:13px;margin:3px 0"><b>${x[0]}:</b> ${esc(x[1])}</div>`).join('') + '<div class="cav" style="margin-top:6px">Rule-based from the as-of data below, no LLM. Analysis, not advice.</div>';
}
function teamPanel(day) {
  const T = day.team;
  $('team').innerHTML = `<h3>What changed since yesterday</h3>` + (T.changes.length ? `<ul>${T.changes.map(x => `<li>${esc(x.text)} <span class="ev2">[${esc(x.evidence)}]</span></li>`).join('')}</ul>` : '<div class="empty" style="margin-bottom:6px">No new verified event, window flip or market trigger.</div>') +
    `<h3>For discussion</h3><ol>${T.prompts.map(x => `<li>${esc(x.text)}<div class="ev2">Evidence: ${esc(x.evidence)}</div></li>`).join('')}</ol><div class="cav" style="margin-top:6px">Rule-based from the data above, no LLM. Analysis, not advice.</div>`;
}

function render() {
  const c = D.cps[cp], d = DT()[idx], day = c.days[d];
  $('date').textContent = new Date(d + 'T00:00:00').toLocaleDateString('en-US', {weekday:'short', month:'short', day:'numeric', year:'numeric'});
  $('slider').max = DT().length - 1; $('slider').value = idx; $('live').style.display = c.live ? '' : 'none';
  timeline(); statusChip(day);
  // events
  const evs = day.events.slice().sort((a, b) => (b.new ? 1 : 0) - (a.new ? 1 : 0) || String(b.alerted_as_of || b.watch_as_of || '').localeCompare(String(a.alerted_as_of || a.watch_as_of || '')) || b.severity - a.severity);
  $('events').innerHTML = evs.length ? evs.map(e => `<div class="ev ${e.new ? 'fresh' : ''}"><div class="hd">${lvlBadge(e.level)}${verdictBadge(e.verdict)}
      ${e.new ? `<span class="badge b-bad">${e.escalated ? 'ESCALATED' : 'NEW'}</span>` : ''}<span class="badge b-neu">sev ${e.severity}</span><span class="badge b-neu">${esc(e.tag)}</span></div>
      <div class="t">${esc(e.headline)}</div>
      ${e.sources.map(s => `<div class="src"><span class="chip t${s.tier}">T${s.tier} ${esc(s.tier_name)}</span><div><a href="${esc(s.url)}" target="_blank" rel="noopener">${esc(s.domain)}</a> <span class="cav">${esc((s.published_at || '').slice(0, 10))}</span>${s.quote ? `<div class="q">“${esc(s.quote)}”</div>` : ''}</div></div>`).join('')}</div>`).join('')
    : '<div class="empty">No watch/ALERT-level events yet for this counterparty on this day.</div>';
  // feed
  $('feed').innerHTML = day.feed.length ? day.feed.slice().reverse().map(f => `<div class="fresh"><span class="badge b-neu">${esc(f.sender)}</span><span class="arrow">→</span><span class="badge b-neu">${esc(f.topic)}</span><span class="tx">${esc(f.text)}</span></div>`).join('') : '<div class="empty">No agent traffic on this day.</div>';
  // market
  const m = day.market;
  if (!m) $('market').innerHTML = '<div class="empty">No market data in this database.</div>';
  else if (m.error || !m.window) $('market').innerHTML = `<div class="empty">${esc(m.error || 'n/a')}</div>`;
  else {
    $('market').innerHTML = `<div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">${winBadge(m.window)}<span class="cav">last close used ${esc(m.bar_date)} · basket P(stress) ${m.p_stress == null ? 'n/a' : m.p_stress.toFixed(2)}</span></div>
      <div class="cav" style="margin:6px 0">${esc((m.drivers || []).join('; '))}</div>
      ${m.moving && m.moving.length ? `<div style="margin:6px 0">${m.moving.map(x => `<span class="badge ${x.label === 'closed' ? 'b-bad' : 'b-warn'}">${esc(x.ticker)} ${esc(x.label)}</span>`).join(' ')}</div>` : ''}
      <table><tr><th>Hedge candidate</th><th>Role</th><th>Score</th><th>Proxy</th></tr>${m.hedges.map(h => `<tr><td><b>${esc(h.ticker)}</b></td><td>${esc(h.role)}</td><td>${h.score.toFixed(2)}</td><td>${esc(h.label)}</td></tr><tr><td colspan="4" class="cav" style="border:0;padding-top:0">${esc(h.caveat)}</td></tr>`).join('')}</table>
      <div class="cav" style="margin-top:6px">Analysis, not a trade instruction; compliance/MNPI check first.</div>`;
  }
  // positions
  $('pos').innerHTML = c.positions.map(p => `<div class="pos"><span>${esc(p.id)} · ${esc(p.name)}<div class="cav">${esc(p.facility_type)} · ${esc(p.relationship)}</div></span><b>${money(p.commitment_usd)}</b></div>`).join('') + `<div class="pos" style="border-top:1px solid var(--line)"><span>Total</span><b>${money(c.exposure)}</b></div>`;
  // actions
  $('actions').innerHTML = day.actions.length ? day.actions.map(a => `<div style="padding:4px 0;border-top:1px solid var(--line)"><span class="badge b-neu">${esc(a.sender)}</span> ${a.today ? '<span class="badge b-bad">NEW</span> ' : ''}${a.stage ? `<span class="badge b-warn">${esc(a.stage)}</span> ` : ''}<span class="cav">${esc(a.as_of)}</span><div>${esc(a.summary)}</div></div>`).join('') : '<div class="empty">No desk actions yet.</div>';
  $('brief').innerHTML = mdLite(day.brief);
  execSummary(day, d); teamPanel(day); chartSvg(); sizeBar();
}

function sizeBar() { document.documentElement.style.setProperty('--tbh', $('topbar').offsetHeight + 'px'); }
addEventListener('resize', sizeBar);
function go(i) { idx = Math.max(0, Math.min(DT().length - 1, i)); render(); }
$('cp').innerHTML = Object.entries(D.cps).map(([id, c]) => `<option value="${id}">${esc(c.name)}</option>`).join('');
$('cp').onchange = e => { cp = e.target.value; idx = D.cps[cp].live ? DT().length - 1 : 0; render(); };
$('slider').oninput = e => { stop(); go(+e.target.value); };
$('prev').onclick = () => { stop(); go(idx - 1); };
$('next').onclick = () => { stop(); go(idx + 1); };
function tick() {
  if (idx >= DT().length - 1) return stop();
  go(idx + 1);
  const dow = new Date(DT()[idx] + 'T00:00:00').getDay();      // weekends fast-forward: one trading day per beat
  timer = setTimeout(tick, +$('speed').value / (dow === 6 || dow === 0 ? 3 : 1));
}
function stop() { if (timer) { clearTimeout(timer); timer = null; } $('play').textContent = 'Play ▶'; }
$('play').onclick = () => { if (timer) return stop(); if (idx >= DT().length - 1) idx = 0; $('play').textContent = 'Pause ❚❚'; timer = setTimeout(tick, +$('speed').value); };
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'SELECT' && e.key !== 'ArrowLeft' && e.key !== 'ArrowRight') return;
  if (e.key === 'ArrowRight') { e.preventDefault(); stop(); go(idx + 1); }
  else if (e.key === 'ArrowLeft') { e.preventDefault(); stop(); go(idx - 1); }
  else if (e.key === ' ' && e.target.tagName !== 'BUTTON') { e.preventDefault(); $('play').click(); }
});
$('chart').addEventListener('mousemove', pinTip); $('chart').addEventListener('mouseleave', () => { $('ptip').style.display = 'none'; });
$('theme').onclick = () => { const r = document.documentElement, dark = getComputedStyle(r).getPropertyValue('--bg').trim() === '#0e1116'; r.dataset.theme = dark ? 'light' : 'dark'; };
$('foot').textContent = D.disclaimer + ' Hypothetical portfolio; market proxies for the two replays were chosen with hindsight (Carvana is a live case: no hindsight).';
(function () { const h = new URLSearchParams(location.hash.slice(1)); if (h.get('cp') && D.cps[h.get('cp')]) { cp = h.get('cp'); $('cp').value = cp; } if (D.cps[cp].live) idx = DT().length - 1; if (h.get('d') && DT().includes(h.get('d'))) idx = DT().indexOf(h.get('d')); })();
heads(); render();
</script>
